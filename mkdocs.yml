site_name: MyBatis Dynamic
theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  language: en

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
      nav_translations:
        zh:
          'Home': '首页'
          'Quick Start': '快速开始'
          'Core Features': '核心功能'
          'Introduction': '简介'
          'DataManager & ID': 'DataManager 与 ID'
          'ModelService': 'ModelService'
          'DataChangeInterceptor': '数据变更拦截器'
          'PermissionGetter & CurrentUserHolder': '权限管理'
          'Spring Integration': 'Spring 集成'
          'Advanced Features': '高级功能'
          'Overview': '概览'
          'Fluent Chain APIs': '流畅链式 API'
          'Join Operations': '连接操作'
          'Recursive & Tree': '递归与树形结构'
          'Relation Filling': '关联填充'
          'ModelService Advanced': 'ModelService 高级功能'
          'Custom Conditions': '自定义条件'
          'Best Practices': '最佳实践'
          'Extensions': '扩展'

extra:
  alternate:
    - name: English
      link: /mybatis-dynamic/
      lang: en
    - name: 简体中文
      link: /mybatis-dynamic/zh/
      lang: zh

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Core Features:
    - Introduction: core-features/index.md
    - Introduction: core-features/1-introduction.md
    - DataManager & ID: core-features/2-datamanager-id.md
    - ModelService: core-features/3-modelservice.md
    - DataChangeInterceptor: core-features/4-datachangeinterceptor.md
    - PermissionGetter & CurrentUserHolder: core-features/5-permissiongetter-currentuserholder.md
  - Spring Integration: spring-integration/index.md
  - Advanced Features:
    - Overview: advanced-features/index.md
    - Fluent Chain APIs: advanced-features/1-fluent-chain-apis-deep-dive.md
    - Join Operations: advanced-features/2-join-operations-deep-dive.md
    - Recursive & Tree: advanced-features/3-recursive-tree-operations.md
    - Relation Filling: advanced-features/4-relation-filling-filldatachain.md
    - ModelService Advanced: advanced-features/5-modelservice-advanced-features.md
    - Custom Conditions: advanced-features/6-custom-conditions.md
    - Best Practices: advanced-features/7-best-practices-faq.md
  - Extensions: extensions/index.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
