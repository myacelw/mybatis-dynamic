site_name: MyBatis Dynamic
theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
  language: en

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true

extra:
  alternate:
    - name: English
      link: /mybatis-dynamic/
      lang: en
    - name: 中文
      link: /mybatis-dynamic/zh/
      lang: zh

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Core Features: core-features.md
  - Spring Integration: spring-integration.md
  - Advanced Features: advanced-features.md
  - Extensions: extensions.md
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
