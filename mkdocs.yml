site_name: MyBatis Dynamic
site_url: https://myacelw.github.io/mybatis-dynamic/

hooks:
  - hooks.py

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  language: en

plugins:
  - search
  - sitemap
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true

extra:
  alternate:
    - name: English
      link: /mybatis-dynamic/
      lang: en
    - name: 简体中文
      link: /mybatis-dynamic/zh/
      lang: zh

extra_javascript:
  - js/i18n-nav.js

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Articles:
    - Introduction: articles/introduction-dynamic-modeling.md
    - Advanced: articles/advanced-dynamic-modeling.md
  - Core Features:
    - Overview: core-features/index.md
    - Introduction: core-features/1-introduction.md
    - DataManager & ID: core-features/2-datamanager-id.md
    - ModelService: core-features/3-modelservice.md
    - DataChangeInterceptor: core-features/4-datachangeinterceptor.md
    - PermissionGetter & CurrentUserHolder: core-features/5-permissiongetter-currentuserholder.md
  - Spring Integration: spring-integration/index.md
  - Advanced Features:
    - Overview: advanced-features/index.md
    - Fluent Chain APIs: advanced-features/1-fluent-chain-apis-deep-dive.md
    - Join Operations: advanced-features/2-join-operations-deep-dive.md
    - Recursive & Tree: advanced-features/3-recursive-tree-operations.md
    - Relation Filling: advanced-features/4-relation-filling-filldatachain.md
    - ModelService Advanced: advanced-features/5-modelservice-advanced-features.md
    - Custom Conditions: advanced-features/6-custom-conditions.md
    - Best Practices: advanced-features/7-best-practices-faq.md
  - Extensions: extensions/index.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
